<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Pamilerin XO - A glassmorphic tic tac toe web app with unbeatable AI, two player mode, and tactile design." />
    <meta name="theme-color" content="#1A0B2E" />
    <title>Pamilerin XO | Glassmorphic Tic Tac Toe</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('pamilerin-xo:v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme === 'light') {
              document.documentElement.dataset.theme = 'light';
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
